<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman File Zipper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="modal-card">
        <!-- Header -->
        <div class="modal-header">
            <div>
                <h1 class="modal-title" id="modal-title">Upload files</h1>
                <p class="modal-subtitle" id="modal-subtitle">Upload files to compress or decompress</p>
            </div>
            <button type="button" class="close-btn" id="close-btn" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Minimalist Segmented Tabs -->
        <div class="segmented-tabs" role="tablist">
            <button type="button" class="tab-item active" id="tab-compress" role="tab" aria-selected="true">
                Compress File
            </button>
            <button type="button" class="tab-item" id="tab-decompress" role="tab" aria-selected="false">
                Decompress (.huf)
            </button>
        </div>

        <!-- Dropzone -->
        <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" class="file-input" aria-label="Select file">
            
            <!-- Default Prompt State -->
            <div class="drop-prompt" id="drop-prompt">
                <div class="cloud-icon">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                        <polyline points="12 13 12 9 10 11"/>
                        <polyline points="12 9 14 11"/>
                    </svg>
                </div>
                <p class="drop-text" id="drop-text">Drag & drop or <span class="choose-link">choose file</span></p>
                <p class="drop-subtext" id="drop-subtext">TXT, DOC, PDF, JPG, PNG &bull; All formats supported</p>
            </div>

            <!-- Selected File State -->
            <div class="file-card hidden" id="file-card">
                <div class="file-left">
                    <div class="file-badge" id="file-ext-badge">FILE</div>
                    <div class="file-meta">
                        <span class="file-name" id="file-name-text">filename.txt</span>
                        <span class="file-size" id="file-size-text">0 KB</span>
                    </div>
                </div>
                <button type="button" class="remove-btn" id="remove-btn" aria-label="Remove selected file">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Compression / Decompression Stats -->
        <div class="stats-card hidden" id="stats-card">
            <div class="stat-group">
                <span class="stat-label" id="label-orig-size">Original</span>
                <span class="stat-value" id="val-orig-size">0 KB</span>
            </div>
            <div class="stat-arrow">&rarr;</div>
            <div class="stat-group">
                <span class="stat-label" id="label-out-size">Compressed</span>
                <span class="stat-value" id="val-out-size">0 KB</span>
            </div>
            <span class="ratio-pill" id="val-ratio">0%</span>
        </div>

        <!-- Footer Actions -->
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancel-btn">Cancel</button>
            <button type="button" class="btn-download" id="download-btn" disabled>Download</button>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
